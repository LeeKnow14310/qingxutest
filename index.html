<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>情绪内耗测试 · 治愈系心理小测验</title>
<style>
  :root{
    --bg:#f4efe9;
    --card:#ffffff;
    --ink:#4d4a48;
    --muted:#9b948e;
    --accent:#c9a9a6;
    --accent-deep:#a98784;
    --line:#ece5dd;
    --shadow:0 10px 30px rgba(160,140,130,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.75;
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    position:relative; overflow-x:hidden;
  }
  .blob{position:fixed; border-radius:50%; filter:blur(50px); opacity:.35; z-index:0; pointer-events:none; animation:floaty 9s ease-in-out infinite;}
  .b1{width:260px;height:260px;background:#e6cfc6;top:-60px;left:-70px;}
  .b2{width:220px;height:220px;background:#cfd9c6;bottom:5%;right:-60px;animation-delay:-3s;}
  .b3{width:180px;height:180px;background:#d3d6e4;top:40%;left:-50px;animation-delay:-6s;}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

  .wrap{width:100%; max-width:560px; padding:24px 20px 60px; position:relative; z-index:1;}

  .card{background:var(--card); border-radius:24px; padding:24px 22px; box-shadow:var(--shadow); border:1px solid #fbf7f3;}
  .btn{
    display:inline-block; border:none; cursor:pointer; font-size:16px; font-weight:600;
    border-radius:999px; padding:14px 34px; transition:transform .25s ease, box-shadow .25s ease, background .25s ease, opacity .25s ease;
    font-family:inherit;
  }
  .btn:active{transform:scale(.96);}
  .primary{background:linear-gradient(135deg,#d4b7b3,#c9a9a6); color:#fff; box-shadow:0 8px 20px rgba(201,169,166,.45);}
  .primary:hover{box-shadow:0 12px 26px rgba(201,169,166,.55); transform:translateY(-2px);}
  .primary:disabled{opacity:.45; box-shadow:none; transform:none; cursor:not-allowed;}
  .ghost{background:transparent; color:var(--muted); padding:14px 22px;}

  .screen{animation:fadeUp .5s ease both;}
  .hidden{display:none;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:translateY(0)}}
  @keyframes popIn{0%{opacity:0; transform:scale(.9)}100%{opacity:1; transform:scale(1)}}
</style>
</head>
<body>
<style>
  /* 开始页 */
  #screen-start{text-align:center; padding-top:40px;}
  .hero-emoji{font-size:64px; animation:floaty 4s ease-in-out infinite; display:inline-block;}
  .hero h1{font-size:30px; margin:12px 0 6px; color:var(--ink); font-weight:800; letter-spacing:2px;}
  .hero-sub{color:var(--muted); margin:0 0 28px; font-size:15px;}
  .intro-card{text-align:left; margin:0 0 26px; color:var(--muted); font-size:14.5px;}
  .intro-card p{margin:0;}
  #btn-start{width:100%; font-size:17px;}

  /* 进度条 */
  .progress-wrap{margin-bottom:18px;}
  .progress-info{font-size:13px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between;}
  .progress-bar{height:8px; background:var(--line); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; width:5%; background:linear-gradient(90deg,#d4b7b3,#b8a9c9); border-radius:999px; transition:width .4s ease;}

  /* 题目卡片 */
  .quiz-card{min-height:300px; display:flex; flex-direction:column;}
  .q-text{font-size:19px; font-weight:700; line-height:1.6; margin:4px 0 22px; color:var(--ink);}
  .options{display:flex; flex-direction:column; gap:12px;}
  .opt{
    display:block; width:100%; text-align:left; background:#faf7f4; border:1.5px solid var(--line);
    border-radius:16px; padding:15px 18px; font-size:15.5px; color:var(--ink); cursor:pointer;
    transition:all .25s ease; font-family:inherit; line-height:1.5;
  }
  .opt:hover{border-color:var(--accent); background:#fdf6f4; transform:translateX(3px);}
  .opt.selected{border-color:var(--accent); background:#f6ecea; color:var(--accent-deep); font-weight:600; box-shadow:0 6px 16px rgba(201,169,166,.25);}
  .opt .tag{display:inline-block; width:22px; margin-right:8px; color:var(--accent-deep); font-weight:700;}
  .hint{font-size:13px; color:var(--muted); margin:16px 0 0; min-height:18px; transition:opacity .3s ease; opacity:0;}
  .hint.show{opacity:1;}

  /* 导航按钮 */
  .nav{display:flex; justify-content:space-between; margin-top:22px; gap:12px;}
  .nav .btn{flex:1;}

  /* 结果页 */
  #screen-result{text-align:center; padding-top:20px;}
  .result-card{background:var(--card); border-radius:28px; padding:34px 24px 30px; box-shadow:var(--shadow); border:1px solid #fbf7f3; animation:popIn .6s ease both;}
  .r-emoji{font-size:60px; display:inline-block; animation:floaty 4.5s ease-in-out infinite;}
  .r-title{font-size:26px; margin:14px 0 4px; font-weight:800;}
  .r-tag{display:inline-block; font-size:12px; letter-spacing:2px; color:var(--muted); margin-bottom:14px;}
  .r-score{display:inline-block; background:var(--accent-soft,#f6ecea); color:var(--accent-deep,#a98784); border-radius:999px; padding:6px 18px; font-size:14px; font-weight:700; margin-bottom:20px;}
  .r-text{text-align:left; font-size:15px; line-height:1.9; color:#5c5753; margin:0 0 26px;}
  .r-text p{margin:0 0 12px;}
  #btn-restart{width:100%;}

  /* 结果配色变体 */
  .res-sage  {--accent-soft:#eef2ea; --accent-deep:#7f9077;}
  .res-rose  {--accent-soft:#f7efee; --accent-deep:#a98784;}
  .res-blue  {--accent-soft:#eef2f7; --accent-deep:#7d90ab;}
  .res-mauve {--accent-soft:#f3eef7; --accent-deep:#9482a9;}

  .disclaimer{font-size:12px; color:#b6afa8; margin-top:22px; line-height:1.7; padding:0 10px;}

  /* 结果页操作按钮 */
  .result-actions{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .result-actions .btn{width:100%;}
  .ghost-bordered{background:#fff; border:1.5px solid var(--line); color:var(--muted); box-shadow:none;}
  .ghost-bordered:hover{border-color:var(--accent); color:var(--accent-deep); transform:translateY(-2px);}

  /* 分享图片弹窗 */
  .share-modal{position:fixed; inset:0; background:rgba(60,52,48,.55); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); z-index:50; display:flex; align-items:center; justify-content:center; padding:18px; animation:fadeUp .3s ease both;}
  .share-modal.hidden{display:none;}
  .share-modal-inner{background:#fff; border-radius:24px; padding:16px; max-width:420px; width:100%; max-height:92vh; overflow-y:auto; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.32);}
  .share-modal-inner img{width:100%; border-radius:16px; display:block; box-shadow:0 8px 24px rgba(160,140,130,.25);}
  .share-hint{font-size:13.5px; color:var(--muted); margin:14px 0 12px; line-height:1.7;}
  .share-btns{display:flex; gap:10px;}
  .share-btns .btn{flex:1; text-align:center;}
  a.btn{display:block; text-decoration:none;}

  @media (max-width:380px){
    .q-text{font-size:17px;}
    .opt{font-size:14.5px; padding:13px 15px;}
  }
</style>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="wrap">

  <section id="screen-start" class="screen">
    <div class="hero">
      <div class="hero-emoji">🌿</div>
      <h1>情绪内耗测试</h1>
      <p class="hero-sub">测一测，你的心正在偷偷消耗多少能量</p>
    </div>
    <div class="card intro-card">
      <p>🌙 共 20 道题 · 约 2 分钟<br>每道题请按<strong>第一直觉</strong>作答，不用想太久</p>
    </div>
    <button class="btn primary" id="btn-start">开始测试</button>
  </section>

  <section id="screen-quiz" class="screen hidden">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="q-num">第 1 题</span>
        <span id="q-total">共 20 题</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="card quiz-card">
      <p class="q-text" id="q-text"></p>
      <div class="options" id="options"></div>
      <p class="hint" id="hint">请选择一个最符合你的选项哦～</p>
    </div>
    <div class="nav">
      <button class="btn ghost" id="btn-prev">上一题</button>
      <button class="btn primary" id="btn-next" disabled>下一题</button>
    </div>
  </section>
  <section id="screen-result" class="screen hidden">
    <div class="result-card" id="result-card">
      <div class="r-emoji" id="r-emoji">🌿</div>
      <h2 class="r-title" id="r-title"></h2>
      <div class="r-tag" id="r-tag"></div>
      <div class="r-score" id="r-score"></div>
      <div class="r-text" id="r-text"></div>
      <div class="result-actions">
        <button class="btn primary" id="btn-share">📸 保存图片分享给朋友</button>
        <button class="btn ghost-bordered" id="btn-restart">🔄 再测一次</button>
      </div>
    </div>
    <p class="disclaimer">本测试仅供自我觉察参考，不构成任何心理诊断建议。<br>如果长期感到痛苦，请记得寻求专业心理帮助 ❤️</p>

    <div class="share-modal hidden" id="share-modal">
      <div class="share-modal-inner">
        <img id="share-img" alt="情绪内耗测试结果">
        <p class="share-hint">长按图片保存到相册 📱<br>或点下方按钮下载到电脑 👇</p>
        <div class="share-btns">
          <a class="btn primary" id="btn-download" download="情绪内耗测试结果.png">下载图片</a>
          <button class="btn ghost" id="btn-close-share">关闭</button>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
const SCALE = ["从不这样", "偶尔这样", "经常这样", "总是这样"];
const questions = [
  "睡前，脑子里会自动回放白天说过的话、做过的事",
  "别人的一句话或一个表情，我会反复琢磨很久",
  "做决定前，我会反复纠结「选错了怎么办」",
  "我经常担心「别人是不是不喜欢我」",
  "一件小事没做好，我会责怪自己很久",
  "心里想拒绝，嘴上却总是答应",
  "遇到事情，我总忍不住先设想最坏的结果",
  "独处时，很多负面情绪会一股脑涌上来",
  "我很难真正放松，总觉得还有事没做完",
  "过去的遗憾会时不时冒出来「纠缠」我",
  "我过度在意自己在别人眼中的形象，感到疲惫",
  "越想「别想太多」，反而想得越多",
  "我会因为纠结而迟迟无法开始行动",
  "别人没及时回消息，我会脑补很多剧情",
  "我习惯把情绪憋在心里，不轻易说出口",
  "事情过去后，我还会复盘「如果当时那样就好了」",
  "我对自己的要求很高，稍有不足就焦虑",
  "社交之后，我需要很久才能「充电」恢复",
  "我常感觉心累，哪怕这一天什么都没干",
  "我总想掌控一切，一旦失控就烦躁不安"
];
const results = [
  {
    min: 0, max: 15, title: "行动派", tag: "轻盈果断 · 低内耗", emoji: "🌿", cls: "res-sage",
    paras: [
      "亲爱的行动派，你的情绪内耗水平很低，这真的很难得。你习惯把事情想清楚就去做，不会让情绪在脑子里反复打转，也不会因为别人的一句话就怀疑自己。你像一阵清爽的风，说走就走、说做就做，很多人羡慕你这份果断和轻盈。",
      "不过我也想轻轻提醒你：有时候「不纠结」也可能是一种无声的保护——把情绪按下、不让自己停下来感受。如果你偶尔在深夜感到一丝空落落，那不是矫情，而是你的心在说，它也需要被听见。",
      "请继续保持你的行动力，同时别忘了偶尔停下来问问自己：这件事是我真的不在乎，还是我不敢在乎？你可以既果断，也温柔地照顾自己的感受。"
    ]
  },
  {
    min: 16, max: 30, title: "敏感体", tag: "细腻敏锐 · 恰到好处的敏感", emoji: "🌸", cls: "res-rose",
    paras: [
      "你的内耗处于中等偏低的水平，我把它叫做「恰到好处的敏感」。你能敏锐地察觉气氛的变化、读懂别人的微表情，这种共情能力是你与生俱来的礼物。",
      "但也正因如此，你会比别人多接收一些情绪信号，偶尔觉得累、偶尔想太多，都是很正常的。你的课题不是「变钝」，而是学会给敏感装上开关：把敏锐留给值得的人和事，把别人的情绪还给别人。",
      "请记住，敏感不是缺陷，是细腻。你不需要为了合群而把自己磨钝。学会在接收外界信号的同时守护好自己的能量边界，你会发现自己既能温柔地感受世界，也能稳稳地做自己。"
    ]
  },
  {
    min: 31, max: 45, title: "躺平族", tag: "温柔逃避 · 需要休息", emoji: "🌙", cls: "res-blue",
    paras: [
      "亲爱的，你的内耗已经有些明显了，而「躺平」其实是你用来保护自己的方式。想得多了、累了，干脆躲起来、不想动——这完全可以理解，你不是懒，你只是需要休息。",
      "躺平像一个柔软的盾牌，帮你挡掉了一部分焦虑；但如果一直举着它，它会慢慢变成一堵墙，把你和真正想要的生活隔开。那些用「无所谓」「算了」压下去的情绪，并不会真的消失。",
      "允许自己休息，但别把「回避」当成「放下」。试着从一件很小很小的事开始，哪怕只是把拖了很久的消息回掉，或者出门晒五分钟太阳。慢慢来，你会重新找回「想动起来」的感觉。"
    ]
  },
  {
    min: 46, max: 60, title: "内耗王", tag: "认真在乎 · 高内耗", emoji: "💭", cls: "res-mauve",
    paras: [
      "抱抱你。看到这个结果，我想先对你说：你会想这么多，不是因为你矫情、不是因为你脆弱，而是因为你太认真、太在乎了。你在脑子里反复排练、反复复盘，是因为你不想搞砸、不想让人失望——这份心，本身就很珍贵。",
      "只是，你把自己当成了世界上最严苛的监工，时刻用「万一」和「如果」鞭策自己。可思考得再多，也不等于已经解决了问题，反而耗干了你的力气。内耗的出口，从来不是「想通」，而是「停下来行动一点点」。",
      "试着把那个巨大的问题拆成今天能做的一小步，做完就奖励一下自己；也请允许自己不完美、允许事情不受控。你不需要把一切都想明白才出发，你可以在路上慢慢明白。"
    ]
  }
];
let current = 0;
let answers = new Array(questions.length).fill(-1);
let currentResult = null;
let currentTotal = 0;

const $ = id => document.getElementById(id);
const screenStart = $("screen-start"), screenQuiz = $("screen-quiz"), screenResult = $("screen-result");
const qText = $("q-text"), optionsEl = $("options"), hintEl = $("hint");
const btnPrev = $("btn-prev"), btnNext = $("btn-next");
const qNum = $("q-num"), progressFill = $("progress-fill");

function renderQuestion(i) {
  current = i;
  qText.textContent = (i + 1) + ". " + questions[i];
  qNum.textContent = "第 " + (i + 1) + " 题";
  progressFill.style.width = ((i + 1) / questions.length * 100) + "%";

  optionsEl.innerHTML = "";
  SCALE.forEach(function (opt, idx) {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="tag">' + "ABCD"[idx] + "</span>" + opt;
    b.onclick = function () { selectOption(idx); };
    if (answers[i] === idx) b.classList.add("selected");
    optionsEl.appendChild(b);
  });

  btnPrev.style.visibility = (i === 0) ? "hidden" : "visible";
  btnNext.textContent = (i === questions.length - 1) ? "提交结果" : "下一题";
  btnNext.disabled = (answers[i] === -1);
  hintEl.classList.remove("show");
}

function selectOption(idx) {
  answers[current] = idx;
  const opts = optionsEl.querySelectorAll(".opt");
  opts.forEach(function (o, k) { o.classList.toggle("selected", k === idx); });
  btnNext.disabled = false;
  hintEl.classList.remove("show");
}

function scrollTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

function next() {
  if (answers[current] === -1) {
    hintEl.textContent = "先选一个选项再继续哦～";
    hintEl.classList.add("show");
    return;
  }
  if (current < questions.length - 1) {
    renderQuestion(current + 1);
    scrollTop();
  } else {
    showResult();
  }
}

function prev() {
  if (current > 0) { renderQuestion(current - 1); scrollTop(); }
}

function showResult() {
  const total = answers.reduce(function (a, b) { return a + b; }, 0);
  const r = results.find(function (x) { return total >= x.min && total <= x.max; }) || results[results.length - 1];
  currentResult = r;
  currentTotal = total;

  $("result-card").className = "result-card " + r.cls;
  $("r-emoji").textContent = r.emoji;
  $("r-title").textContent = r.title;
  $("r-tag").textContent = r.tag;
  $("r-score").textContent = "你的得分：" + total + " 分";
  $("r-text").innerHTML = r.paras.map(function (p) { return "<p>" + p + "</p>"; }).join("");

  screenStart.classList.add("hidden");
  screenQuiz.classList.add("hidden");
  screenResult.classList.remove("hidden");
  scrollTop();
}

function restart() {
  current = 0;
  answers = new Array(questions.length).fill(-1);
  screenResult.classList.add("hidden");
  screenStart.classList.remove("hidden");
}

$("btn-start").onclick = function () {
  screenStart.classList.add("hidden");
  screenQuiz.classList.remove("hidden");
  renderQuestion(0);
};
btnNext.onclick = next;
btnPrev.onclick = prev;
/* ===== 生成分享卡片图（Canvas 绘制，零外部依赖）===== */
const COLOR_MAP = {
  "res-sage":  { soft: "#eef2ea", deep: "#7f9077" },
  "res-rose":  { soft: "#f7efee", deep: "#a98784" },
  "res-blue":  { soft: "#eef2f7", deep: "#7d90ab" },
  "res-mauve": { soft: "#f3eef7", deep: "#9482a9" }
};
const FONT = "-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif";
const EMOJI_FONT = "'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji','Segoe UI Symbol',sans-serif";

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth) {
  var lines = [], line = "";
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ctx.measureText(line + ch).width > maxWidth && line !== "") {
      lines.push(line);
      line = ch;
    } else {
      line += ch;
    }
  }
  if (line !== "") lines.push(line);
  return lines;
}

function generateShareImage(r, total) {
  var W = 750, H = 1050, dpr = 2;
  var canvas = document.createElement("canvas");
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  var c = COLOR_MAP[r.cls] || { soft: "#f7efee", deep: "#a98784" };

  // 背景渐变
  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#f7f2ec");
  bg.addColorStop(1, c.soft);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 白色圆角卡片
  ctx.save();
  ctx.shadowColor = "rgba(160,140,130,0.22)";
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 16;
  roundRect(ctx, 44, 44, W - 88, H - 88, 44);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.restore();

  var cx = W / 2;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  // 顶部小标题
  ctx.fillStyle = "#b6afa8";
  ctx.font = "600 26px " + FONT;
  ctx.fillText("情 绪 内 耗 测 试", cx, 150);

  // emoji
  ctx.font = "88px " + EMOJI_FONT;
  ctx.textBaseline = "middle";
  ctx.fillText(r.emoji, cx, 258);
  ctx.textBaseline = "alphabetic";

  // 结果名称
  ctx.fillStyle = c.deep;
  ctx.font = "800 70px " + FONT;
  ctx.fillText(r.title, cx, 398);

  // 标签
  ctx.fillStyle = "#9b948e";
  ctx.font = "400 24px " + FONT;
  ctx.fillText(r.tag, cx, 446);

  // 得分徽章
  var badge = "你的得分：" + total + " 分";
  ctx.font = "700 26px " + FONT;
  var bw = ctx.measureText(badge).width + 64;
  roundRect(ctx, cx - bw / 2, 484, bw, 58, 29);
  ctx.fillStyle = c.soft;
  ctx.fill();
  ctx.fillStyle = c.deep;
  ctx.fillText(badge, cx, 484 + 38);

  // 正文（取第一段解读）
  ctx.textAlign = "left";
  ctx.fillStyle = "#5c5753";
  ctx.font = "400 28px " + FONT;
  var padX = 104;
  var lines = wrapText(ctx, r.paras[0], W - padX * 2);
  if (lines.length > 7) { lines = lines.slice(0, 7); lines[6] = lines[6].slice(0, -1) + "…"; }
  var lineH = 48, bodyY = 620;
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], padX, bodyY + i * lineH);
  }

  // 底部信息
  ctx.textAlign = "center";
  ctx.fillStyle = c.deep;
  ctx.font = "700 25px " + FONT;
  ctx.fillText("leeknow14310.github.io/qingxutest", cx, H - 96);
  ctx.fillStyle = "#b6afa8";
  ctx.font = "400 23px " + FONT;
  ctx.fillText("长按保存 · 测测你的情绪内耗类型", cx, H - 56);

  return canvas.toDataURL("image/png");
}

function openShare() {
  if (!currentResult) return;
  var dataUrl;
  try {
    dataUrl = generateShareImage(currentResult, currentTotal);
  } catch (e) {
    alert("图片生成失败啦，请在电脑上再试一次～");
    return;
  }
  $("share-img").src = dataUrl;
  $("btn-download").href = dataUrl;
  $("btn-download").download = "情绪内耗测试_" + currentResult.title + ".png";
  $("share-modal").classList.remove("hidden");
}

function closeShare() { $("share-modal").classList.add("hidden"); }

$("btn-restart").onclick = restart;
$("btn-share").onclick = openShare;
$("btn-close-share").onclick = closeShare;
$("share-modal").onclick = function (e) { if (e.target === this) closeShare(); };
</script>
